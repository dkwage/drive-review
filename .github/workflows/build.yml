name: Build Drive Review for Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Package Drive Review
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name DriveReview main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DriveReview-windows
          path: dist/DriveReview/
          if-no-files-found: error
