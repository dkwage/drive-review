name: Build and release

# Every push builds and tests on Windows. Push a tag like v1.0.0 to also publish a GitHub release.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Package Drive Review
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name DriveReview
          --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets
          --hidden-import PySide6.QtPdf --hidden-import PySide6.QtPdfWidgets
          --additional-hooks-dir packaging_hooks --collect-binaries pillow_heif main.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/DriveReview -DestinationPath DriveReview-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DriveReview-Windows.zip
          path: DriveReview-Windows.zip
          if-no-files-found: error

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          generate_release_notes: true
